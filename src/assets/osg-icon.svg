<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
  </defs>

  <!-- ============================================= -->
  <!-- ÍCONE AUTOCOMTIDO — Backplate circular        -->
  <!-- ============================================= -->
  <!-- Fundo círculo completo -->
  <circle cx="256" cy="256" r="256" fill="#f7e8ce" stroke="#b0865a" stroke-width="4"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#c49a6c" stroke-width="1.5" opacity="0.5"/>

  <!-- Tudo abaixo é recortado pelo círculo -->
  <g clip-path="url(#circleClip)">

    <!-- ============================================= -->
    <!-- EASTER EGG: Dunas de Arrakis                  -->
    <!-- ============================================= -->
    <path d="
      M -20 440
      C 60 440, 80 380, 140 380
      C 200 380, 220 300, 310 300
      C 380 300, 400 360, 450 370
      C 490 378, 520 400, 540 420
      L 540 540
      L -20 540
      Z
    " fill="#c49a6c" opacity="0.45"/>

    <path d="
      M -20 475
      C 40 475, 70 435, 130 435
      C 190 435, 210 365, 290 365
      C 350 365, 380 415, 430 425
      C 470 432, 510 445, 540 465
      L 540 540
      L -20 540
      Z
    " fill="#a0785a" opacity="0.6"/>

    <!-- Olhos do Maker (Spice blue) — Easter egg sutil -->
    <ellipse cx="298" cy="312" rx="4" ry="2.2" fill="#00bfa5" opacity="0.9"/>
    <ellipse cx="322" cy="312" rx="4" ry="2.2" fill="#00bfa5" opacity="0.9"/>

    <!-- Grãos de spice espalhados -->
    <circle cx="200" cy="140" r="2" fill="#00bfa5" opacity="0.35"/>
    <circle cx="210" cy="135" r="1.2" fill="#00bfa5" opacity="0.45"/>
    <circle cx="180" cy="160" r="1.5" fill="#00bfa5" opacity="0.25"/>
    <circle cx="380" cy="310" r="2.5" fill="#00bfa5" opacity="0.3"/>
    <circle cx="390" cy="300" r="1.5" fill="#00bfa5" opacity="0.4"/>
    <circle cx="420" cy="330" r="2" fill="#00bfa5" opacity="0.2"/>
    <circle cx="240" cy="110" r="1.8" fill="#00bfa5" opacity="0.3"/>
    <circle cx="360" cy="180" r="1.3" fill="#00bfa5" opacity="0.35"/>

    <!-- ============================================= -->
    <!-- SELO HEXAGONAL CENTRAL — OSG (Expandido)      -->
    <!-- ============================================= -->

    <!-- Sombra do selo -->
    <path d="
      M 256 88
      L 380 160
      L 380 312
      L 256 384
      L 132 312
      L 132 160
      Z
    " fill="#2d1b0e" opacity="0.2" transform="translate(0, 5)"/>

    <!-- Selo hexagonal/diamante expandido -->
    <path d="
      M 256 88
      L 380 160
      L 380 312
      L 256 384
      L 132 312
      L 132 160
      Z
    " fill="#2d1b0e" stroke="#5c3a21" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Borda interna decorativa -->
    <path d="
      M 256 104
      L 366 168
      L 366 304
      L 256 368
      L 146 304
      L 146 168
      Z
    " fill="none" stroke="#7a4a28" stroke-width="1.5" opacity="0.5"/>

    <!-- Texto OSG — CENTRALIZADO NO HEXÁGONO -->
    <text x="256" y="236"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="78"
          font-weight="bold"
          fill="#f7e8ce"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="3">
      OSG
    </text>

    <!-- Subtítulo WORK — CENTRALIZADO ABAIXO DE OSG -->
    <text x="256" y="290"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="18"
          fill="#c49a6c"
          text-anchor="middle"
          dominant-baseline="central"
          letter-spacing="6"
          opacity="0.9">
      WORK
    </text>

    <!-- Brilho no topo do selo -->
    <circle cx="256" cy="88" r="9" fill="#00bfa5" opacity="0.15"/>
    <circle cx="256" cy="88" r="2.5" fill="#00bfa5" opacity="0.55"/>

  </g>
</svg>