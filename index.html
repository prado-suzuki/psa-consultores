    <!--
      Ícone do site. O que existia era 1484x1920, retangular, e o Google descarta
      ícone que não seja quadrado com lado múltiplo de 48 — daí ele cair no ícone
      antigo em cache (o do domínio de preview do Lovable). Todos abaixo são
      quadrados e múltiplos de 48.

      O `.ico` na raiz não é redundante: é o caminho que o buscador procura por
      padrão quando não consegue usar o declarado.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png">
    <!-- O iOS pinta transparência de preto, então esta versão tem fundo branco. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PSA Consultores" />
    <meta property="og:title" content="PSA Consultores — Consultoria Tributária e Gestão Empresarial" />
    <meta property="og:description" content="Consultoria tributária, recuperação de créditos fiscais e gestão de processos para empresas brasileiras." />
    <meta property="og:url" content="https://psaconsultores.com.br/" />
    <meta property="og:locale" content="pt_BR" />
    <!-- Sem isto o link compartilhado no WhatsApp e no LinkedIn sai sem imagem. -->
    <meta property="og:image" content="https://psaconsultores.com.br/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="PSA Consultores" />

    <meta name="twitter:card" content="summary_large_image" />
