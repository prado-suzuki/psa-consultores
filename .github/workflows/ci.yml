name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --build --noEmit

      - name: Tests
        run: bunx vitest run

      - name: Build
        run: bun run build
        env:
          # A folga de heap nasceu de um chunk unico de ~8 MB: minificar aquilo
          # estourava o heap padrao do V8 (~2 GB) e o passo abortava com
          # SIGABRT/exit 134. As rotas voltaram a ser `lazy` e o chunk de
          # entrada caiu para a ordem de centenas de KB, mas a folga FICA: sao
          # centenas de chunks agora, e o pico de memoria do Rollup e do grafo
          # inteiro, nao do maior arquivo. Baixar este numero e experimento
          # proprio, com o build da CI como prova -- nao palpite.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  migrations:
    name: Schema (migrations, types.ts, mapa)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      # fetch-depth: 0 e obrigatorio: sem historico nao existe diff contra a base.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # A catraca olha SO as migrations do diff do PR, nunca as 165 do historico.
      # O schema do banco tem dois escritores (nos no sandbox, o Lovable em
      # producao) e o Lovable devolve o mesmo DDL num arquivo com nome de UUID.
      # O DDL roda duas vezes; se for idempotente isso e no-op, se nao for e erro.
      - name: Migration idempotente
        run: |
          novas=$(git diff --name-only --diff-filter=AM \
            ${{ github.event.pull_request.base.sha }} HEAD \
            -- 'supabase/migrations/*.sql')
          if [ -z "$novas" ]; then
            echo "PR sem migration nova ou alterada."
            exit 0
          fi
          echo "$novas"
          bun scripts/checa-idempotencia-migrations.ts $novas

      # O mapa do banco e funcao PURA do types.ts (scripts/gen-mapa-banco.mjs so le
      # aquele arquivo). Entao a CI consegue PROVAR que os dois correspondem, sem
      # falar com banco nenhum: regenera e exige diff vazio.
      - name: Mapa do banco em dia com o types.ts
        run: |
          node scripts/gen-mapa-banco.mjs
          if ! git diff --exit-code -- docs/rls/mapa-do-banco.md; then
            echo "::error::docs/rls/mapa-do-banco.md nao corresponde ao types.ts deste commit."
            echo "Rode: node scripts/gen-mapa-banco.mjs && git add docs/rls/mapa-do-banco.md"
            exit 1
          fi

      # A metade que machuca: coluna nova no types.ts sem migration que a crie quase
      # sempre e trabalho nao mesclado de outra pessoa, importado do sandbox
      # compartilhado. Nao existe em producao, e a main e buildada contra producao.
      - name: types.ts nao importou schema de fora
        run: bun scripts/checa-types-vs-migrations.ts ${{ github.event.pull_request.base.sha }}
