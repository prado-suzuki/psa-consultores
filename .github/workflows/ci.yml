name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --build --noEmit

      - name: Tests
        run: bunx vitest run

      - name: Build
        run: bun run build
        env:
          # A folga de heap nasceu de um chunk unico de ~8 MB: minificar aquilo
          # estourava o heap padrao do V8 (~2 GB) e o passo abortava com
          # SIGABRT/exit 134. As rotas voltaram a ser `lazy` e o chunk de
          # entrada caiu para a ordem de centenas de KB, mas a folga FICA: sao
          # centenas de chunks agora, e o pico de memoria do Rollup e do grafo
          # inteiro, nao do maior arquivo. Baixar este numero e experimento
          # proprio, com o build da CI como prova -- nao palpite.
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
