name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs em andamento no mesmo PR quando há novo push
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        # Usa invocação direta do tsc para funcionar mesmo se o script
        # `npm run typecheck` ainda não existir em main (PR #9 adiciona).
        run: npx tsc --build --noEmit

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.event.pull_request.number }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
